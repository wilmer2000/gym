@if (modal(); as state) {
  <div (click)="trigger('close')">
    <div (click)="$event.stopPropagation()">
      <header>
        <span>
          {{ tone().icon }}
        </span>
        <div>
          <h2>{{ state.title }}</h2>
          @if (state.subtitle) {
            <p>{{ state.subtitle }}</p>
          }
        </div>
      </header>

      <div>
        <ng-content />
        <ng-container #host />
      </div>

      <footer>
        @if (state.buttons.backButton) {
          <button type="button" (click)="trigger('back')">Volver</button>
        }
        @if (state.buttons.closeButton) {
          <button type="button" (click)="trigger('close')">
            {{ state.closeLabel }}
          </button>
        }
        @if (state.buttons.okButton) {
          <button type="button" (click)="trigger('ok')">
            {{ state.okLabel }}
          </button>
        }
      </footer>
    </div>
  </div>
}
