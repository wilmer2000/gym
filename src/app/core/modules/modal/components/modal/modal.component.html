@if (modal(); as state) {
  <div
    class="fixed inset-0 z-40 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm"
    (click)="trigger('close')"
  >
    <div class="card w-full max-w-md" (click)="$event.stopPropagation()">
      <header class="flex items-start gap-3 p-4">
        <span
          class="flex size-10 shrink-0 items-center justify-center rounded-full text-lg font-medium {{
            tone().iconClass
          }}"
        >
          {{ tone().icon }}
        </span>
        <div class="min-w-0">
          <h2 class="{{ tone().title }}">{{ state.title }}</h2>
          @if (state.subtitle) {
            <p class="mt-1 text-sm text-gray-400">{{ state.subtitle }}</p>
          }
        </div>
      </header>

      <div class="px-4 pb-4">
        <ng-content />
        <ng-container #host />
      </div>

      <footer class="flex gap-2 px-4 pb-4">
        @if (state.buttons.backButton) {
          <button type="button" class="bg-gray-600 text-gray-100" (click)="trigger('back')">
            Volver
          </button>
        }
        @if (state.buttons.closeButton) {
          <button type="button" class="bg-gray-600 text-gray-100" (click)="trigger('close')">
            {{ state.closeLabel }}
          </button>
        }
        @if (state.buttons.okButton) {
          <button type="button" (click)="trigger('ok')">
            {{ state.okLabel }}
          </button>
        }
      </footer>
    </div>
  </div>
}
