<div>
  @if (label()) {
    <label [for]="id()">{{ label() }}</label>
  }

  <select
    [id]="id()"
    [value]="value()"
    [disabled]="disabled()"
    (change)="setValue($event)"
    (blur)="onTouched()"
  >
    @if (placeholder()) {
      <option value="" [selected]="value() === ''">{{ placeholder() }}</option>
    }
    @for (opt of options(); track opt.id) {
      <option [value]="opt.id" [selected]="opt.id === value()">
        {{ opt.icon ? opt.icon + ' ' : '' }}{{ opt.label }}
      </option>
    }
  </select>
</div>
