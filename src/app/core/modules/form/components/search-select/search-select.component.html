<div class="flex flex-col gap-1">
  @if (label()) {
    <label [for]="id()" class="label mb-0">{{ label() }}</label>
  }

  <div class="flex gap-2">
    <select
      class="select w-auto cursor-pointer"
      aria-label="Buscar en"
      [value]="selected()"
      (change)="setOption($event)"
    >
      @for (opt of options(); track opt.id) {
        <option [value]="opt.id">{{ opt.icon ? opt.icon + ' ' : '' }}{{ opt.label }}</option>
      }
    </select>

    <input
      [id]="id()"
      type="search"
      class="input"
      [placeholder]="placeholder()"
      [value]="query()"
      (input)="search($event)"
    />
  </div>
</div>
