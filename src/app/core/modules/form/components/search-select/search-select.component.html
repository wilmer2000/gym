<div>
  @if (label()) {
    <label [for]="id()">{{ label() }}</label>
  }

  <div>
    <select aria-label="Buscar en" [value]="selected()" (change)="setOption($event)">
      @for (opt of options(); track opt.id) {
        <option [value]="opt.id">{{ opt.icon ? opt.icon + ' ' : '' }}{{ opt.label }}</option>
      }
    </select>

    <input
      [id]="id()"
      type="search"
      [placeholder]="placeholder()"
      [value]="query()"
      (input)="search($event)"
    />
  </div>
</div>
