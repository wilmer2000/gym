<label [for]="id()" class="flex justify-center items-center h-full">
  <input
    [id]="id()"
    type="checkbox"
    [checked]="value()"
    [disabled]="disabled()"
    (change)="setValue($event)"
    (blur)="onTouched()"
  />
  @if (label()) {
    <span class="text-nowrap">{{ label() }}</span>
  }
</label>
