<div>
  <div>
    <app-input
      id="range-date-from"
      label="Desde"
      type="date"
      [max]="to()"
      [invalid]="invalid()"
      [ngModel]="from()"
      (ngModelChange)="setValue('from', $event)"
    />
    <app-input
      id="range-date-to"
      label="Hasta"
      type="date"
      [min]="from()"
      [invalid]="invalid()"
      [ngModel]="to()"
      (ngModelChange)="setValue('to', $event)"
    />
  </div>
  @if (hasRange() && showClean()) {
    <button type="button" (click)="clear()">Limpiar</button>
  }
  @if (invalid()) {
    <p role="alert">La fecha final debe ser mayor o igual a la inicial.</p>
  }
</div>
