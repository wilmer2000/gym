<nav>
  <button type="button" [disabled]="current() === 0" (click)="go(current() - 1)">
    <span>&larr;</span> Anterior
  </button>

  @for (page of visiblePages(); track page) {
    <button type="button" (click)="go(page)">
      {{ page + 1 }}
    </button>
  }

  <button type="button" [disabled]="current() === pages() - 1" (click)="go(current() + 1)">
    Siguiente <span>&rarr;</span>
  </button>

  <label>
    <span>Filas</span>
    <select [value]="size()" (change)="changeSize($event)">
      @for (option of sizes(); track option) {
        <option [value]="option" [selected]="option === size()">{{ option }}</option>
      }
    </select>
  </label>
</nav>
