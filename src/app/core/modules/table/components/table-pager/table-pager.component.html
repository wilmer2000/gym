<div>
  <div>
    <ng-content />
    @if (editable()) {
      <button
        type="button"
        [disabled]="!canEdit()"
        [attr.aria-disabled]="!canEdit()"
        (click)="openEdit()"
      >
        Editar {{ selectedKeys().length }}
      </button>
    }
    @if (removable()) {
      <button
        type="button"
        [disabled]="!canEdit()"
        [attr.aria-disabled]="!canEdit()"
        (click)="openRemove()"
      >
        Eliminar {{ selectedKeys().length }}
      </button>
    }
  </div>
  <app-table
    [columns]="columns()"
    [rows]="pagedRows()"
    [scrollable]="scrollable()"
    [total]="rows().length"
    [selectable]="selectable()"
    [rowKey]="rowKey()"
    [highlightRows]="highlightRows()"
    [sortKey]="sortKey()"
    [sortDirection]="sortDirection()"
    [actionsTemplate]="actionsTemplate()"
    [cellTemplates]="cellTemplates()"
    (sortChange)="sortChange.emit($event)"
    (selectionChange)="onSelectionChange($event)"
  />
  <app-pager
    [page]="current()"
    [total]="rows().length"
    [size]="pageSize()"
    (pageChange)="page.set($event)"
    (sizeChange)="changeSize($event)"
  />
</div>
