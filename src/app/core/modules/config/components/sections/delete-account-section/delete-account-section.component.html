<app-section [title]="'Eliminar cuenta'">
  <div class="flex flex-col gap-4">
    <p>
      Se eliminarán todos los planes y el catálogo vuelve a su estado inicial. Esta acción es
      permanente y no hay forma de recuperar la información. Descargá una copia de seguridad antes
      de continuar para evitar la pérdida total de los datos.
    </p>

    <button (click)="confirmDelete()">Eliminar cuenta</button>
  </div>
</app-section>
