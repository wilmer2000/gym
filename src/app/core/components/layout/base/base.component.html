<div class="min-h-screen bg-surface-muted text-primary">
  <app-header
    class="fixed inset-x-0 top-0 z-50 border-b border-border bg-surface px-3 py-2 md:px-4 md:py-3"
    [menuOpen]="sidebarOpen()"
    [collapsed]="sidebarCollapsed()"
    (menuToggle)="toggleMenu()"
    (sidebarToggle)="toggleSidebar()"
  />

  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-30 bg-black/40 md:hidden" (click)="closeMenu()"></div>
  }

  <aside
    id="app-sidebar"
    class="fixed inset-y-0 left-0 z-40 w-64 overflow-y-auto bg-gray-950 px-2 pb-4 pt-16 text-gray-400 transition-transform duration-200 ease-in-out"
    [class]="
      (sidebarOpen() ? 'translate-x-0' : '-translate-x-full') +
      (sidebarCollapsed() ? ' md:-translate-x-full' : ' md:translate-x-0')
    "
  >
    <app-menu class="block pt-4" (click)="closeMenu()" />
  </aside>

  <main
    class="flex flex-col px-3 pb-3 pt-16 md:fixed md:top-14 md:right-0 md:bottom-0 md:max-h-screen md:overflow-y-auto md:px-6 md:py-6"
    [class]="sidebarCollapsed() ? 'md:left-0' : 'md:left-64'"
  >
    <div class="flex w-full max-w-[1920px] mx-auto">
      <router-outlet />
    </div>
  </main>
</div>
