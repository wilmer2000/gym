<div class="flex w-full justify-center">
  <nav class="relative flex p-1 gap-4 rounded-full glass text-white">
    <span class="dot size-12 rounded-full bg-primary pointer-events-none"></span>
    @for (item of navItems(); track item.route) {
      <a
        class="relative size-12 rounded-full flex items-center justify-center"
        [routerLink]="item.route"
        [routerLinkActive]="'text-zinc-900'"
        ariaCurrentWhenActive="location"
      >
        <ng-icon [name]="item.icon" class="text-xl" />
      </a>
    }
  </nav>
</div>
