<section>
  <div>
    <div>
      <h2>Ejercicios</h2>
      <button type="button" (click)="addRow()">Agregar ejercicio</button>
    </div>

    @if (rows().length) {
      <div>
        @for (row of rows(); track $index) {
          <div>
            <div>
              <select
                [value]="row.exerciseId"
                [attr.aria-label]="'Ejercicio ' + ($index + 1)"
                (change)="setExercise($index, $event)"
              >
                <option value="">Elegí un ejercicio</option>
                @for (exercise of exercises(); track exercise.id) {
                  <option [value]="exercise.id">
                    {{ exercise.name }} · {{ muscle(exercise) }}
                  </option>
                }
              </select>
            </div>

            <div>
              <app-input
                [id]="'plan-sets-' + $index"
                [name]="'plan-sets-' + $index"
                label="Sets"
                type="number"
                min="1"
                [ngModel]="row.sets"
                (ngModelChange)="setSets($index, $event)"
              />
            </div>

            <div>
              <app-input
                [id]="'plan-reps-' + $index"
                [name]="'plan-reps-' + $index"
                label="Reps"
                type="number"
                min="1"
                [ngModel]="row.reps"
                (ngModelChange)="setReps($index, $event)"
              />
            </div>

            <div>
              <button
                type="button"
                [disabled]="$first"
                aria-label="Subir"
                (click)="move($index, -1)"
              >
                ↑
              </button>
              <button type="button" [disabled]="$last" aria-label="Bajar" (click)="move($index, 1)">
                ↓
              </button>
              <button type="button" aria-label="Quitar" (click)="removeRow($index)">×</button>
            </div>
          </div>
        }
      </div>
    } @else {
      <p>Agregá al menos un ejercicio.</p>
    }
  </div>
</section>
