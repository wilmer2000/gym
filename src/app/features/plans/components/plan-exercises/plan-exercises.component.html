<app-section title="Ejercicios">
  @if (rows().length) {
    <div
      class="max-h-80 overflow-y-auto flex flex-col gap-2"
      cdkDropList
      (cdkDropListDropped)="drop($event)"
    >
      @for (row of rows(); track $index) {
        <div class="flex w-full items-center gap-3 rounded-2xl bg-gray-700/30 p-3" cdkDrag>
          <div class="relative size-20 shrink-0 overflow-hidden rounded-lg bg-neutral-950">
            <img
              class="object-cover"
              [ngSrc]="image(row.exerciseId)"
              fill
              [alt]="name(row.exerciseId)"
            />
          </div>

          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm">{{ name(row.exerciseId) }}</span>
            <span class="block text-xs text-gray-400">
              {{ muscle(row.exerciseId) }} · {{ type(row.exerciseId) }}
            </span>
            <span class="block text-xs text-gray-400">{{ row.sets }} × {{ row.reps }}</span>
          </span>

          <div class="flex flex-col gap-1">
            <button
              type="button"
              class="size-8 bg-gray-600 p-0 text-gray-100 flex items-center justify-center"
              aria-label="Editar"
              (click)="openForm($index)"
            >
              <ng-icon name="hugePencil" class="text-sm" />
            </button>
            <button
              type="button"
              class="size-8 bg-gray-600 p-0 text-gray-100 flex items-center justify-center"
              aria-label="Eliminar"
              (click)="removeRow($index)"
            >
              <ng-icon name="hugeDelete01" class="text-sm" />
            </button>
          </div>
        </div>
      }
    </div>
  } @else {
    <p>Agregá al menos un ejercicio.</p>
  }
  <button type="button" (click)="openForm()">Agregar ejercicio</button>
</app-section>
