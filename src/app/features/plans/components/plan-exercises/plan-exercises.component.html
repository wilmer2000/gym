<section class="card">
  <div class="card-body flex flex-col gap-3">
    <div class="flex items-center justify-between gap-2">
      <h2 class="text-sm font-semibold text-primary">Ejercicios</h2>
      <button type="button" class="btn btn-secondary btn-sm" (click)="addRow()">
        Agregar ejercicio
      </button>
    </div>

    @if (rows().length) {
      <div class="flex flex-col gap-3">
        @for (row of rows(); track $index) {
          <div class="flex flex-col gap-2 sm:flex-row sm:items-end">
            <div class="flex-1">
              <select
                class="select"
                [value]="row.exerciseId"
                [attr.aria-label]="'Ejercicio ' + ($index + 1)"
                (change)="setExercise($index, $event)"
              >
                <option value="">Elegí un ejercicio</option>
                @for (exercise of exercises(); track exercise.id) {
                  <option [value]="exercise.id">{{ exercise.name }}</option>
                }
              </select>
            </div>

            <div class="w-full sm:w-20">
              <app-input
                [id]="'plan-sets-' + $index"
                [name]="'plan-sets-' + $index"
                label="Sets"
                type="number"
                min="1"
                [ngModel]="row.sets"
                (ngModelChange)="setSets($index, $event)"
              />
            </div>

            <div class="w-full sm:w-24">
              <app-input
                [id]="'plan-reps-' + $index"
                [name]="'plan-reps-' + $index"
                label="Reps"
                type="number"
                min="1"
                [ngModel]="row.reps"
                (ngModelChange)="setReps($index, $event)"
              />
            </div>

            <div class="flex gap-1">
              <button
                type="button"
                class="btn btn-ghost btn-sm"
                [disabled]="$first"
                aria-label="Subir"
                (click)="move($index, -1)"
              >
                ↑
              </button>
              <button
                type="button"
                class="btn btn-ghost btn-sm"
                [disabled]="$last"
                aria-label="Bajar"
                (click)="move($index, 1)"
              >
                ↓
              </button>
              <button
                type="button"
                class="btn btn-ghost btn-sm text-danger"
                aria-label="Quitar"
                (click)="removeRow($index)"
              >
                ×
              </button>
            </div>
          </div>
        }
      </div>
    } @else {
      <p class="text-xs text-text-muted">Agregá al menos un ejercicio.</p>
    }
  </div>
</section>
