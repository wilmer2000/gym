<app-container title="Planes">
  <div header>
    <button class="btn-icon" [routerLink]="'/plans/new'">
      <ng-icon [name]="'hugePlusSign'" />
    </button>
  </div>

  <div class="card">
    <div class="card-body flex flex-col gap-4">
      <div class="flex gap-2">
        <app-input
          class="grow"
          id="plan-search"
          placeholder="Buscar por nombre"
          [ngModel]="search()"
          (ngModelChange)="search.set($event)"
        />

        <app-toggle
          id="plan-active"
          label="Activos"
          [ngModel]="onlyActive()"
          (ngModelChange)="onlyActive.set($event)"
        />
      </div>

      @if (rows().length) {
        <div class="flex flex-col gap-2">
          @for (row of rows(); track row.plan.id) {
            <app-plan-item [row]="row" (changed)="load()" />
          }
        </div>
      } @else {
        <div class="flex w-full border items-center justify-center min-h-80">
          <p>
            {{
              search() || onlyActive()
                ? 'No hay planes que coincidan con la búsqueda.'
                : 'Todavía no hay planes.'
            }}
          </p>
        </div>
      }
    </div>
  </div>
</app-container>
