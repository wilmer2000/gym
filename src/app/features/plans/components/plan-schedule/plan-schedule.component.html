<app-section [title]="'Calendario'">

  <div class="flex flex-col gap-4">
    <span>Días</span>
    <div class="grid grid-cols-4 gap-2">
      @for (day of weekdays; track day.value) {
        <button
          type="button"
          [class.bg-gray-400!]="!selectedDays().includes(day.value)"
          [attr.aria-pressed]="selectedDays().includes(day.value)"
          (click)="toggleDay(day.value)"
        >
          {{ day.label }}
        </button>
      }
    </div>
    @if (selectedDays().length === 0) {
      <p class="text-gray-600 text-sm">Elegí al menos un día.</p>
    }
  </div>
</app-section>
