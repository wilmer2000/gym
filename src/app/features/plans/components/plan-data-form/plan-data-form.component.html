<app-section [title]="'Información del plan'">
  <app-input
    id="plan-name"
    name="plan-name"
    label="Nombre"
    [invalid]="name().trim() === ''"
    [ngModel]="name()"
    (ngModelChange)="nameChange.emit($event)"
  />

  <app-text-area
    id="plan-description"
    name="plan-description"
    label="Descripción"
    [ngModel]="description()"
    (ngModelChange)="descriptionChange.emit($event)"
  />

  <app-toggle
    id="plan-active"
    name="plan-active"
    label="Activo"
    [ngModel]="active()"
    (ngModelChange)="activeChange.emit($event)"
  />
</app-section>
