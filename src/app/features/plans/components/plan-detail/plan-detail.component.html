<app-container [title]="'Plan'">
  <div header>
    <app-button
      [iconButton]="true"
      [icon]="'hugeArrowRight01'"
      routerLink="/plans"
      aria-label="Volver"
    />
  </div>

  @if (row(); as item) {
    <app-section [title]="'Información del plan'">
      <app-plan-item [row]="item" [readonly]="true" />
    </app-section>

    <app-section [title]="'Ejercicios'">
      <app-exercise-selector [ngModel]="exerciseIds()" [readonly]="true" />
    </app-section>

    <div class="flex gap-2">
      <button type="button" [routerLink]="['/plans', item.plan.id, 'edit']">Editar</button>
      <button type="button" (click)="remove()">Eliminar</button>
    </div>
  } @else {
    <div>
      <p>No se encontró el plan.</p>
      <a routerLink="/plans">Volver al listado</a>
    </div>
  }
</app-container>
