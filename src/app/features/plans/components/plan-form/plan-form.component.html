<app-container [title]="planId ? 'Editar plan' : 'Nuevo plan'">
  <div header class="flex gap-2">
    <a routerLink="/plans" class="btn btn-secondary">Cancelar</a>
    <button type="submit" form="plan-form" class="btn btn-primary">Guardar</button>
  </div>

  @if (error()) {
    <p class="card border-danger px-4 py-3 text-sm text-danger">{{ error() }}</p>
  }

  <form id="plan-form" class="flex flex-col gap-4" (ngSubmit)="save()">
    <app-plan-data-form
      [name]="name()"
      [description]="description()"
      [active]="active()"
      (nameChange)="name.set($event)"
      (descriptionChange)="description.set($event)"
      (activeChange)="active.set($event)"
    />

    <app-plan-schedule-form
      [mode]="mode()"
      [startDate]="startDate()"
      [endDate]="endDate()"
      [selectedDays]="selectedDays()"
      [dates]="dates()"
      (modeChange)="mode.set($event)"
      (startDateChange)="startDate.set($event)"
      (endDateChange)="endDate.set($event)"
      (selectedDaysChange)="selectedDays.set($event)"
      (datesChange)="dates.set($event)"
    />

    <app-plan-exercises-form
      [exercises]="exercises"
      [rows]="rows()"
      (rowsChange)="rows.set($event)"
    />
  </form>
</app-container>
