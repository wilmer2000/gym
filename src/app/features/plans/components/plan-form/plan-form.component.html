<app-container [title]="planId ? 'Editar plan' : 'Nuevo plan'" [subtitle]="planId ? `Editando ${name()}` : 'Crea tu nuevo plan'">
  <div header>
    <button routerLink="/plans">Cancelar</button>
  </div>

  <form id="plan-form" (ngSubmit)="save()" class="flex flex-col gap-4">
    <app-plan-data-form
      [name]="name()"
      [description]="description()"
      [active]="active()"
      (nameChange)="name.set($event)"
      (descriptionChange)="description.set($event)"
      (activeChange)="active.set($event)"
    />

    <app-plan-schedule-form
      [selectedDays]="selectedDays()"
      (selectedDaysChange)="selectedDays.set($event)"
    />

    <app-plan-exercises-form
      [exercises]="exercises"
      [rows]="rows()"
      (rowsChange)="rows.set($event)"
    />
    @if (error()) {
      <p>{{ error() }}</p>
    }
    <button type="submit" form="plan-form">Guardar</button>
  </form>
</app-container>
