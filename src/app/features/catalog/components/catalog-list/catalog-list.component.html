<app-container title="Ejercicios" subtitle="Catálogo fijo de ejercicios">
  <div header class="w-full lg:w-64">
    <app-input
      id="catalog-search"
      placeholder="Buscar por nombre"
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
    />
  </div>

  <app-filters [filters]="filters" (selectionChange)="selections.set($event)" />

  @if (exercises().length) {
    <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
      @for (exercise of exercises(); track exercise.id) {
        <a
          [routerLink]="['/exercises', exercise.id]"
          class="card card-hover flex flex-col gap-2 p-4 text-left"
        >
          <h2 class="text-base font-semibold text-primary">{{ exercise.name }}</h2>
          <p class="text-sm text-text-secondary">{{ exercise.muscleGroup }}</p>
          <p class="mt-auto text-xs text-text-muted">{{ equipment(exercise) }}</p>
        </a>
      }
    </div>
  } @else {
    <div class="card px-6 py-12 text-center">
      <p class="text-sm text-text-secondary">
        {{
          hasFilters()
            ? 'No hay ejercicios que coincidan con la búsqueda.'
            : 'El catálogo está vacío.'
        }}
      </p>
    </div>
  }
</app-container>
